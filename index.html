, 0.6)",description:"따뜻한 가을 햇살처럼 마음을 비추는 노란빛 토파즈입니다. 마음에 안정을 찾아줍니다.",givenAngle:85,hintText:"위쪽 각도가 85도입니다. 자, 토파즈가 빛나도록 슬라이더를 천천히 맞추어보세요.",facts:"토파즈는 건강과 희망을 상징하며 태양의 기운을 가득 담고 있습니다."},{id:6,name:"평화의 아쿠아마린 목걸이",engName:"Aquamarine",color:"from-cyan-400 to-sky-600",textColor:"text-cyan-500",gemColor:"#0891b2",glowColor:"rgba(8, 145, 178, 0.6)",description:"영원한 청춘과 시원한 바다를 닮은 아쿠아마린입니다. 물거품처럼 맑게 빛나네요.",givenAngle:75,hintText:"잔잔한 파도 위를 걷듯, 마주보는 대각의 크기의 합이 180도가 되도록 슬라이더 조절을 해줍니다.",facts:"밤에 더욱 빛을 발하여 '밤의 보석 여왕'이라 불리기도 한답니다."},{id:7,name:"열정의 가넷 목걸이",engName:"Garnet",color:"from-red-700 to-rose-900",textColor:"text-rose-700",gemColor:"#be123c",glowColor:"rgba(190, 18, 60, 0.6)",description:"진실된 우정과 깊은 열정의 석류석 가넷입니다. 정답을 맞춰 매혹적인 가넷을 정화하세요.",givenAngle:60,hintText:"위쪽 각도는 60도입니다! 아래 슬라이더의 최대치(120도)까지 가보는 건 어떨까요?",facts:"변치 않는 의리와 은혜를 수호해주는 소중한 보석입니다."},{id:8,name:"순수의 페리도트 목걸이",engName:"Peridot",color:"from-lime-500 to-green-600",textColor:"text-lime-600",gemColor:"#65a30d",glowColor:"rgba(101, 163, 13, 0.6)",description:"밤의 장막을 걷는 우주의 빛을 가진 연두빛 페리도트입니다. 부부의 사랑과 안녕을 지킵니다.",givenAngle:100,hintText:"오! 이번엔 위쪽 각도가 100도로 조금 더 넓네요. 그렇다면 마주보는 아래쪽 각도는 얼만지 눈치채셨죠?",facts:"혜성이 지구에 떨어진 운석 안에서도 발견되는 신비의 우주 보석이랍니다."},{id:9,name:"풍요의 시트린 목걸이",engName:"Citrine",color:"from-orange-400 to-amber-500",textColor:"text-orange-500",gemColor:"#ea580c",glowColor:"rgba(234, 88, 12, 0.6)",description:"따스한 황금빛으로 번영과 가을의 결실을 축복하는 시트린입니다. 마주보는 대각의 크기의 합이 아름답게 완성되도록 가꾸어보세요!",givenAngle:110,hintText:"황금빛 시트린도 내접사각형 속성의 신성한 변하지 않는 법칙을 따릅니다. 위쪽 각도가 110도라면, 마주보는 아래쪽 각도는 몇 도여야 할까요?",facts:"유럽에서는 예로부터 부를 축적하게 하는 '행운의 상인석'으로 유명했습니다."},{id:10,name:"영원의 다이아몬드 목걸이",engName:"Diamond",color:"from-slate-300 to-indigo-300",textColor:"text-slate-600",gemColor:"#93c5fd",glowColor:"rgba(147, 197, 253, 0.7)",description:"무지갯빛 찬란한 광채를 내뿜는 궁극의 영원석 다이아몬드입니다. 마지막 관문을 열어보세요!",givenAngle:120,hintText:"가장 넓은 120도 각도입니다! 마주보는 대각과의 완벽한 180도 하모니를 일깨워 완성해보세요.",facts:"지구상에서 가장 단단하며 영원히 변치 않는 고귀한 약속의 상징입니다."}];/**
